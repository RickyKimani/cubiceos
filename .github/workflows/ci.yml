name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0

  build-test:
    name: Build and Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js (for Tailwind)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm' # Cache npm dependencies

      - name: Go Env
        run: go env

      - name: Generate Templ components
        run: go run github.com/a-h/templ/cmd/templ@v0.3.943

      - name: Build Tailwind CSS
        run: |
          npm install -D tailwindcss
          npx tailwindcss -i ./internal/web/assets/css/input.css -o ./internal/web/assets/css/output.css --minify

      - name: Verify build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v