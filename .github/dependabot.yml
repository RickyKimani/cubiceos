version: 2
updates:
	# Go modules (root go.mod)
	- package-ecosystem: "gomod"
		directory: "/"
		schedule:
			interval: "weekly"
			day: "monday"
			time: "09:00"
			timezone: "UTC"
		open-pull-requests-limit: 10
		labels:
			- "dependencies"
			- "go"
		commit-message:
			prefix: "chore(deps)"
			include: "scope"
		groups:
			gomod-minor-and-patch:
				patterns:
					- "*"
				update-types:
					- "minor"
					- "patch"

	# GitHub Actions workflows
	- package-ecosystem: "github-actions"
		directory: "/"
		schedule:
			interval: "weekly"
			day: "monday"
			time: "09:15"
			timezone: "UTC"
		open-pull-requests-limit: 5
		labels:
			- "dependencies"
			- "github-actions"
		commit-message:
			prefix: "chore(deps)"
			include: "scope"
		groups:
			gha-minor-and-patch:
				patterns:
					- "*"
				update-types:
					- "minor"
					- "patch"

	# Frontend tooling (optional): enabled if package.json is present at repo root
	- package-ecosystem: "npm"
		directory: "/"
		schedule:
			interval: "weekly"
			day: "monday"
			time: "09:30"
			timezone: "UTC"
		open-pull-requests-limit: 5
		labels:
			- "dependencies"
			- "javascript"
		commit-message:
			prefix: "chore(deps)"
			include: "scope"
		groups:
			npm-minor-and-patch:
				patterns:
					- "*"
				update-types:
					- "minor"
					- "patch"
